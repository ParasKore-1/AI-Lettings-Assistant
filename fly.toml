# Fly.io config for the API:  fly launch --no-deploy --copy-config && fly deploy
app = "keyring-api"
primary_region = "lhr"

[build]
  dockerfile = "apps/server/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8787"
  ENABLE_DEBUG = "true"
  SEED_ON_EMPTY = "true"
  # WEB_ORIGIN = "https://your-web.vercel.app"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

# Optional persistence: fly volumes create keyring_data --size 1
# [mounts]
#   source = "keyring_data"
#   destination = "/data"
