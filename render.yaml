# Render blueprint: the Keyring API (mock mode by default).
# The web app is deployed separately (Vercel: apps/web/vercel.json).
services:
  - type: web
    name: keyring-api
    runtime: node
    plan: free
    region: frankfurt
    # npx pnpm rather than `corepack enable`: Render's Node install dir is read-only.
    # NODE_ENV=development for the install only: NODE_ENV=production (below) would skip devDependencies like tsup.
    buildCommand: NODE_ENV=development npx -y pnpm@9.6.0 install --frozen-lockfile && npx -y pnpm@9.6.0 --filter @keyring/server build
    startCommand: node --disable-warning=ExperimentalWarning apps/server/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.17.0
      - key: NODE_ENV
        value: production
      - key: WEB_ORIGIN
        value: '*' # public demo API without cookies; tighten to the web URL(s) if you like
      - key: ENABLE_DEBUG
        value: 'true' # keeps the "Simulate on next reply" demo menu working
      - key: SEED_ON_EMPTY
        value: 'true'
      - key: RATE_LIMIT_PER_MINUTE
        value: '20'
      - key: DATABASE_PATH
        value: ./data/keyring.sqlite
      - key: ANTHROPIC_API_KEY
        sync: false # optional: add in the dashboard to enable the real model
    # Free instances have an ephemeral disk: SQLite resets on redeploy/restart and
    # the server re-seeds demo data. A Docker alternative is in apps/server/Dockerfile.
